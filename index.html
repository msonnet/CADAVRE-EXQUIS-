<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0805" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cadavre Exquis" />
    <meta name="description" content="Jeu surréaliste pour une voix humaine et quarante inconnus" />
    <meta name="keywords" content="cadavre exquis, jeu surréaliste, poésie, écriture, multijoueur" />
    <meta name="author" content="nathansonnet" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Bodoni+Moda:opsz,ital,wght@0,6..96,400;0,6..96,700;0,6..96,900;1,6..96,400;1,6..96,700;1,6..96,900&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Caveat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Cadavre Exquis</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Désinstalle les service workers obsolètes avant le chargement de l'app
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) {
            r.update();
          }
        });
      }
      // Les erreurs non rattrapées restent tracées en console — jamais affichées
      // au joueur : l'écran de secours du carnet (ErrorBoundary) s'en charge.
      window.addEventListener('error', function(e) {
        console.error('[Cadavre Exquis]', e.message, e.filename + ':' + e.lineno, e.error && e.error.stack);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
